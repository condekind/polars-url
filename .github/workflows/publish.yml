name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Maturin
        run: python -m pip install --upgrade pip maturin
      - name: Publish to PyPI
        run: maturin publish --release --token "${PYPI_TOKEN}" --skip-existing
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
