[build-system]
requires = ["maturin>=1.0,<2.0", "polars>=0.40.0"]
build-backend = "maturin"

[project]
name = "polars-url"
description = "Parse/extract URL fields with Polars plugins."
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
module-name = "polars_url.polars_url"
